<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Only for your eyes</title><link rel="stylesheet" href="style.css"></head><body><main class="page"><div class="login"><div style="font-size:32px">✿</div><p class="eyebrow">just one little thing</p><h2>Only for your eyes</h2><p class="hint">the day you came into this world<br>and made it beautiful.</p><input id="dob" inputmode="numeric" maxlength="8" placeholder="DDMMYYYY" aria-label="Date of birth"><a href="main.html" class="enter" onclick="return validateDob()">enter</a><p id="error" class="error"></p></div></main><script>function validateDob(){const x=document.getElementById('dob');const e=document.getElementById('error');x.value=x.value.replace(/\D/g,'');if(x.value==='24092002')return true;e.textContent='That doesn’t seem right 🌷';return false}document.getElementById('dob').addEventListener('input',function(){this.value=this.value.replace(/\D/g,'').slice(0,8)});</script></body></html>
